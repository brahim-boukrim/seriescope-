<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sériescope</title>
    <link rel="stylesheet" href="./dist/output.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body class="m-0 bg-black">
    <header class="p-4 flex justify-start items-center gap-1">
        <div class="bg-white  p-3 py-2.5 rounded-md w-fit"> <i class="fa-solid fa-clapperboard "></i></div>
        <p class="text-white text-2xl font-bold">Sériescope</p>
    </header>
    <section class="px-4 py-8 text-white">
        <h1 class="text-3xl font-bold">Explore les séries TV</h1>
        <p class="text-md text-gray-400">Retrouve tes séries préférées et enrichis le catalogue.</p>
        <form class=" border-2 border-[#393939] p-2 rounded-xl mt-3 flex flex-col justify-between gap-1">
            <h2>Ajouter une série</h2>
            <p class="text-md text-gray-400">Les champs marqués d’un * sont obligatoires.</p>
            <div class="grid grid-cols-1 gap-1.5 md:grid-cols-3">
                <div class="flex flex-col justify-between gap-0.5 mb-0.5"><label>Nom de la série *</label>
                <input id="nom" class="border-2 border-[#393939] rounded-md p-1.5" type="text" placeholder="Ex. The Bear"></div>
                <div class="flex flex-col justify-between gap-0.5 mb-0.5"><label>Genre(s) *<span class="ml-1 text-md text-gray-400">séparés par des virgules</span></label>
                <input id="genre" class="border-2 border-[#393939] rounded-md p-1.5" type="text" placeholder="Ex. Drame, Comédie"></div>
                <div class="flex flex-col justify-between gap-0.5 mb-0.5"><label>Langue du serie*</label>
                <input id="lang" class="border-2 border-[#393939] rounded-md p-1.5" type="text" placeholder="Ex. English"></div>
            </div>
            <div class="flex flex-col justify-between gap-0.5 mb-0.5">
            <label>Description<span class="ml-1 text-md text-gray-400">facultative</span></label>
            <textarea id="description" placeholder="Résume la série en quelques mots…" class="border-2 border-[#393939] rounded-md p-1.5 resize-none"></textarea>
            </div>

            <div class="w-full flex justify-between py-3 gap-12 ">  
                    <div hidden class="bg-amber-200 flex justify-center items-center w-full rounded-md md:w-40"><input type="file" accept="image/*" id="photo" class=" text-black w-27.5  file:hidden" ></div>
                     <button id="submit" class="bg-white  h-10 rounded-md text-black w-full md:w-40"><i class="fa-solid fa-plus"></i> Ajouter la série</button></div>
        </form>

    </section>
    <section class="text-white p-4">
        <h2 class="font-bold text-2xl">Catalogue des séries</h2>
        <p class=" text-md text-gray-400">Recherche par nom ou explore un genre.</p>

        <form id="form" class=" border-2 border-[#393939] p-2 rounded-xl mt-3 grid grid-cols-1 gap-1.5 md:grid-cols-2">
            <div class="flex flex-col justify-end md:col-span-3">
                <label class="text-xl" >Recherche</label>
                <input id="lookup" class="border-2 border-[#393939] rounded-md p-1.5" type="text" placeholder="Ex. Breaking Bad">
            </div>
            <div class="flex items-end gap-1.5">
                <div class="flex flex-col  justify-center w-full">
                    <label class="">Genre</label>
                    <select id="filtre" class="border-2 border-[#393939] rounded-md p-1.5 w-full h-[39.2px] bg-black">
                        <option value="">tous les genre</option>
                    </select>
                </div>
                <div class="flex flex-col  justify-center w-full">
                    <label class="">language</label>
                    <select id="language" class="border-2 border-[#393939] rounded-md p-1.5 w-full h-[39.2px] bg-black">
                        <option value="">tous les langues</option>
                    </select>
                </div>
            </div>
                    <button type="reset"  class="w-full border-2 border-[#393939] rounded-md md:mt-9  h-fit p-1.5 "><i class="fa-solid fa-rotate-right"></i> Réinitialiser</button>
            </div>
            
        </form>

    </section>
    
    <section  class="p-4">
        <p id="counter" class="text-gray-400">10 séries affichées</p>
        <div id="show" class="grid grid-cols-1  gap-5 text-white  md:grid-cols-3">
           
        </div>
        <div class="w-full py-2 text-white flex justify-center text-3xl " id="empty">no result was found !</div>
    </section>
    
    <script type="module" src="src/main.js"></script>
</body>
</html>
